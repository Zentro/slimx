[package]
name = "rust_lib_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
bnum = "0.13.0"
curve25519-dalek = { version = "4.1.3", features = ["legacy_compatibility"] }
pqc_kyber = { version = "0.7.1", features = ["kyber1024", "std"]}
sha2 = "0.10.9"
x25519-dalek = { version = "2.0.0", features = ["static_secrets", "reusable_secrets"] }
rand = "0.8.5"
hkdf = "0.12.3"
serde_json = "1.0.148"
hex = "0.4.3"
reqwest = { version = "0.12.28", features = ["json", "blocking"] }
aes-gcm = "0.10.3"
flutter_rust_bridge = "=2.11.1"
serde = "1.0.228"
serde_derive = "1.0.228"

[profile.dev]
panic="abort"